<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <title>Escrime Mali — Compétition PUBG Mobile</title>
  <style>
/* ============================================================
   ESCRIME MALI — Feuille de style
   Thème tactique esports : charbon profond + ambre PUBG +
   vert / rouge Mali. Typo : Rajdhani (titres) + Barlow (texte).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap');

:root {
  --bg:        #0b0e13;
  --bg-2:      #10151d;
  --panel:     #151b25;
  --panel-2:   #1b222e;
  --line:      #262f3d;
  --line-soft: #1f2733;

  --amber:     #f5a623;   /* accent principal (PUBG) */
  --amber-dk:  #c77f10;
  --green:     #2fb862;   /* Mali */
  --red:       #e63946;   /* Mali / danger */
  --gold:      #ffd35c;

  --txt:       #e7edf5;
  --muted:     #8a97a8;
  --muted-2:   #5c6675;

  --r:   14px;
  --r-s: 9px;
  --shadow: 0 18px 40px -20px rgba(0,0,0,.8);
  --glow: 0 0 0 1px rgba(245,166,35,.35), 0 0 26px -6px rgba(245,166,35,.4);

  --ff-disp: 'Rajdhani', system-ui, sans-serif;
  --ff-body: 'Barlow', system-ui, sans-serif;
  --ff-cond: 'Barlow Semi Condensed', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--ff-body);
  background:
    radial-gradient(1100px 600px at 80% -10%, rgba(245,166,35,.07), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, rgba(47,184,98,.06), transparent 55%),
    var(--bg);
  color: var(--txt);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

h1,h2,h3,h4 { font-family: var(--ff-disp); font-weight: 700; letter-spacing: .3px; line-height: 1.1; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img, video { max-width: 100%; display: block; }
input, textarea, select {
  font-family: var(--ff-body); font-size: 15px; color: var(--txt);
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 12px 14px; width: 100%; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,166,35,.15); }
textarea { resize: vertical; min-height: 90px; }
::placeholder { color: var(--muted-2); }
select option { background: var(--bg-2); }

/* ---------- Icônes ---------- */
.ic { width: 22px; height: 22px; flex: 0 0 auto; }
.ic-sm { width: 18px; height: 18px; }
.ic-lg { width: 30px; height: 30px; }

/* ---------- Utilitaires ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.center { align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--ff-cond); text-transform: uppercase; letter-spacing: 2.5px; font-size: 12px; color: var(--amber); }
.hidden { display: none !important; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .5px; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--txt);
  padding: 12px 18px; border-radius: var(--r-s); font-weight: 600; font-size: 15px;
  transition: transform .12s, background .18s, border-color .18s, box-shadow .18s;
}
.btn:hover { transform: translateY(-1px); border-color: #37435a; }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-primary { background: linear-gradient(135deg, var(--amber), var(--amber-dk)); color: #1a1204; border-color: transparent; }
.btn-primary:hover { box-shadow: var(--glow); }
.btn-green { background: linear-gradient(135deg, var(--green), #1e874a); color: #04140a; border-color: transparent; }
.btn-red { background: linear-gradient(135deg, var(--red), #b3202c); color: #fff; border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }
.btn .ic { width: 18px; height: 18px; }

/* ---------- Badges & puces ---------- */
.badge {
  font-family: var(--ff-cond); text-transform: uppercase; letter-spacing: 1px;
  font-size: 11px; padding: 4px 9px; border-radius: 100px; border: 1px solid var(--line);
  color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
}
.badge.ok    { color: var(--green); border-color: rgba(47,184,98,.4);  background: rgba(47,184,98,.09); }
.badge.warn  { color: var(--amber); border-color: rgba(245,166,35,.4); background: rgba(245,166,35,.09); }
.badge.bad   { color: var(--red);   border-color: rgba(230,57,70,.4);  background: rgba(230,57,70,.09); }
.badge.live  { color: #ff5252; border-color: rgba(255,82,82,.5); }
.badge.live::before { content:""; width:7px; height:7px; border-radius:50%; background:#ff5252; animation: pulse 1.2s infinite; }

/* ---------- Cartes ---------- */
.card {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-radius: var(--r); padding: 18px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.card::before {
  content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  opacity:.5;
}

/* ============================================================
   AUTHENTIFICATION
   ============================================================ */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 22px; }
.auth-card { width: 100%; max-width: 420px; }
.brand-lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 26px; }
.brand-mark {
  width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--amber), var(--amber-dk));
  color: #1a1204; box-shadow: var(--glow); position: relative;
  animation: floaty 5s ease-in-out infinite;
}
.brand-mark .ic { width: 40px; height: 40px; }
.brand-name { font-family: var(--ff-disp); font-size: 30px; letter-spacing: 2px; text-transform: uppercase; }
.brand-name b { color: var(--amber); }
.brand-tag { font-family: var(--ff-cond); text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--muted); }

.tabs { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 100px; padding: 4px; margin-bottom: 18px; }
.tabs button { flex: 1; border: none; background: transparent; color: var(--muted); padding: 10px; border-radius: 100px; font-weight: 600; transition: .2s; }
.tabs button.active { background: var(--amber); color: #1a1204; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted-2); font-size: 13px; margin: 18px 0; }
.divider::before, .divider::after { content:""; height:1px; background: var(--line); flex:1; }

.btn-google { background: #fff; color: #1f2733; border-color: #fff; }
.btn-google .ic { color: #1f2733; }
.btn-google:hover { box-shadow: 0 0 24px -8px rgba(255,255,255,.5); }

/* ============================================================
   COQUE APPLICATION (nav + contenu)
   ============================================================ */
.app-shell { min-height: 100vh; padding-bottom: 84px; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 16px; background: rgba(11,14,19,.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand-name { font-size: 20px; letter-spacing: 1px; }
.topbar-mark { width: 34px; height: 34px; border-radius: 9px; display:grid; place-items:center; background: linear-gradient(140deg,var(--amber),var(--amber-dk)); color:#1a1204; }
.topbar-mark .ic { width: 20px; height: 20px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--txt); display: grid; place-items: center;
  position: relative; transition: .18s;
}
.icon-btn:hover { border-color: var(--amber); color: var(--amber); }
.notif-dot { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--panel-2); }

.content { max-width: 940px; margin: 0 auto; padding: 20px 16px; }
.screen { animation: fadeUp .4s ease; }
.screen-head { margin-bottom: 18px; }
.screen-head h2 { font-size: 26px; text-transform: uppercase; }

/* barre de navigation basse (mobile-first) */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: grid; grid-template-columns: repeat(6,1fr);
  background: rgba(14,18,25,.94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  border: none; background: transparent; color: var(--muted-2);
  padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: var(--ff-cond); font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
  transition: color .2s; position: relative;
}
.tabbar button .ic { width: 23px; height: 23px; }
.tabbar button.active { color: var(--amber); }
.tabbar button.active::before {
  content:""; position:absolute; top:0; left:50%; transform: translateX(-50%);
  width: 26px; height: 3px; border-radius: 0 0 4px 4px; background: var(--amber);
}
.tabbar .tab-badge { position:absolute; top:6px; right: calc(50% - 20px); min-width:16px; height:16px; padding:0 4px; border-radius:100px; background:var(--red); color:#fff; font-size:10px; display:grid; place-items:center; }

/* ============================================================
   GRILLES / LISTES
   ============================================================ */
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }

.stat {
  background: linear-gradient(180deg,var(--panel),var(--bg-2));
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
}
.stat .k { font-family: var(--ff-disp); font-size: 30px; color: var(--amber); }
.stat .l { font-family: var(--ff-cond); text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px; color: var(--muted); }
.stat.green .k { color: var(--green); } .stat.red .k { color: var(--red); }

/* carte de match */
.match-card { cursor: pointer; transition: transform .15s, border-color .2s; }
.match-card:hover { transform: translateY(-3px); border-color: var(--amber); }
.match-banner {
  height: 108px; border-radius: var(--r-s); margin: -18px -18px 14px;
  background:
    linear-gradient(180deg, transparent 40%, rgba(11,14,19,.9)),
    repeating-linear-gradient(135deg, #1b2431 0 16px, #18202c 16px 32px);
  position: relative; display: flex; align-items: flex-end; padding: 12px 16px;
}
.match-banner::after {
  content:""; position:absolute; inset:0; opacity:.14;
  background: radial-gradient(circle at 78% 20%, var(--amber), transparent 45%);
}
.match-title { font-family: var(--ff-disp); font-size: 20px; text-transform: uppercase; z-index:1; }
.meta-line { display:flex; flex-wrap:wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; }
.meta-line .row { gap: 6px; }
.meta-line .ic { width: 16px; height: 16px; color: var(--amber); }

.progress { height: 8px; border-radius: 100px; background: var(--bg-2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display:block; height:100%; background: linear-gradient(90deg,var(--amber),var(--gold)); transition: width .5s; }

/* liste d'éléments */
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s);
}
.avatar {
  width: 42px; height: 42px; border-radius: 11px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--panel-2), var(--bg-2));
  border: 1px solid var(--line); display: grid; place-items: center;
  font-family: var(--ff-disp); color: var(--amber); font-size: 18px; overflow: hidden;
}
.avatar img { width:100%; height:100%; object-fit: cover; }
.rank-pill { font-family: var(--ff-disp); font-size: 15px; width: 34px; height: 34px; border-radius: 9px; display:grid; place-items:center; background: var(--bg-2); border: 1px solid var(--line); }
.rank-1 { color:#04140a; background: linear-gradient(140deg,var(--gold),#e0a800); border:none; }
.rank-2 { color:#04140a; background: linear-gradient(140deg,#cfd8e3,#9aa6b5); border:none; }
.rank-3 { color:#fff; background: linear-gradient(140deg,#c77f10,#8a5606); border:none; }

/* ============================================================
   SHORTS (façon TikTok)
   ============================================================ */
.shorts-feed { max-width: 460px; margin: 0 auto; height: calc(100vh - 150px); overflow-y: scroll; scroll-snap-type: y mandatory; border-radius: var(--r); border: 1px solid var(--line); }
.short {
  position: relative; height: calc(100vh - 150px); scroll-snap-align: start;
  background: #000; display: grid; place-items: center; overflow: hidden;
}
.short video, .short img { width: 100%; height: 100%; object-fit: cover; }
.short-overlay { position: absolute; inset: auto 0 0 0; padding: 18px 16px 22px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
.short-side { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.short-side button { border:none; background: rgba(0,0,0,.35); color:#fff; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; backdrop-filter: blur(6px); transition:.15s; }
.short-side button:hover { color: var(--amber); transform: scale(1.08); }
.short-side .count { font-size: 12px; color:#fff; font-weight:600; }

/* ============================================================
   CHAT
   ============================================================ */
.chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 150px); background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.chat-stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; display: flex; flex-direction: column; gap: 3px; }
.msg .who { font-size: 12px; color: var(--amber); font-weight: 600; }
.bubble { background: var(--panel-2); border: 1px solid var(--line); padding: 9px 13px; border-radius: 13px 13px 13px 4px; word-break: break-word; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.me .bubble { background: linear-gradient(135deg, var(--amber), var(--amber-dk)); color: #1a1204; border-color: transparent; border-radius: 13px 13px 4px 13px; }
.msg .time { font-size: 10px; color: var(--muted-2); }
.msg audio { max-width: 240px; }
.msg img, .msg video { border-radius: 10px; max-height: 220px; }
.chat-input { display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
.chat-input input { border-radius: 100px; }
.rec-dot { color: var(--red); animation: pulse 1s infinite; }

/* fils privés */
.thread-item { cursor: pointer; }
.thread-item:hover { border-color: var(--amber); }

/* ============================================================
   MODALE
   ============================================================ */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(4,6,9,.72); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 18px; animation: fade .2s; }
.modal { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); animation: fadeUp .28s; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head h3 { font-size: 20px; text-transform: uppercase; }
.modal-body { padding: 18px; }
.modal-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }

/* ============================================================
   TOASTS
   ============================================================ */
.toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; width: calc(100% - 32px); max-width: 400px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-radius: var(--r-s); background: var(--panel-2); border: 1px solid var(--line); box-shadow: var(--shadow); animation: slideDown .3s; }
.toast.ok { border-color: rgba(47,184,98,.5); } .toast.ok .ic { color: var(--green); }
.toast.err { border-color: rgba(230,57,70,.5); } .toast.err .ic { color: var(--red); }
.toast.info .ic { color: var(--amber); }

/* ============================================================
   ADMIN
   ============================================================ */
.admin-body { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.admin-side { background: var(--bg-2); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.admin-side .brand-name { font-size: 20px; margin-bottom: 4px; }
.admin-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 20px; }
.admin-nav button {
  display: flex; align-items: center; gap: 11px; border: none; background: transparent;
  color: var(--muted); padding: 11px 12px; border-radius: var(--r-s); font-weight: 500;
  font-size: 15px; text-align: left; transition: .18s;
}
.admin-nav button:hover { background: var(--panel); color: var(--txt); }
.admin-nav button.active { background: var(--panel-2); color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
.admin-nav .ic { width: 20px; height: 20px; }
.admin-main { padding: 24px; overflow-x: hidden; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.table th { font-family: var(--ff-cond); text-transform: uppercase; letter-spacing: 1px; font-size: 12px; color: var(--muted); }
.table tr:hover td { background: var(--panel); }
.table-wrap { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.toggle { position: relative; width: 48px; height: 26px; flex: 0 0 auto; }
.toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.toggle span { position: absolute; inset: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 100px; transition: .2s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: .2s; }
.toggle input:checked + span { background: rgba(47,184,98,.25); border-color: var(--green); }
.toggle input:checked + span::after { transform: translateX(22px); background: var(--green); }

/* état vide */
.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty .ic { width: 46px; height: 46px; color: var(--muted-2); margin-bottom: 10px; }

/* chargement */
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--amber); animation: spin .8s linear infinite; margin: 30px auto; }

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-14px); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes shimmer { to { background-position: 200% 0; } }

.skeleton { background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 50%, var(--panel) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: var(--r-s); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 760px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .admin-body { grid-template-columns: 1fr; }
  .admin-side { position: static; height: auto; }
  .admin-nav { flex-direction: row; overflow-x: auto; }
  .admin-nav button { white-space: nowrap; }
  .admin-nav button.active { box-shadow: inset 0 -3px 0 var(--amber); }
}
@media (max-width: 460px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .screen-head h2 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto; }
}

</style>
</head>
<body>

  <!-- ======================= AUTHENTIFICATION ======================= -->
  <section id="authView" class="auth-wrap">
    <div class="auth-card card">
      <div class="brand-lockup">
        <div class="brand-mark" data-icon="crosshair"></div>
        <div class="brand-name">ESCRIME <b>MALI</b></div>
        <div class="brand-tag">Compétition officielle PUBG Mobile</div>
      </div>

      <div class="tabs" id="authTabs">
        <button data-tab="login" class="active">Connexion</button>
        <button data-tab="register">Inscription</button>
      </div>

      <!-- Connexion -->
      <form id="loginForm">
        <div class="field"><label>Adresse e-mail</label><input type="email" name="email" required autocomplete="email" placeholder="joueur@mail.com" /></div>
        <div class="field"><label>Mot de passe</label><input type="password" name="password" required minlength="6" placeholder="••••••••" /></div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>

      <!-- Inscription -->
      <form id="registerForm" class="hidden">

function icon(name, cls = "") {
  const d = PATHS[name] || PATHS.info;
  const attrs = Object.entries(P).map(([k, v]) => `${k}="${v}"`).join(" ");
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" ${attrs} aria-hidden="true">${d}</svg>`;
}

function injectIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((el) => {
    if (el.dataset.iconDone) return;
    el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon));
    el.dataset.iconDone = "1";
  });
}

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const esc = (s = "") =>
  String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const initials = (name = "?") =>
  name.trim().split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() || "?";

const fmtMoney = (n) =>
  (Number(n) || 0).toLocaleString("fr-FR") + " FCFA";

function fmtDate(d, t) {
  if (!d) return "Date à venir";
  try {
    const dd = new Date(d + (t ? "T" + t : "T00:00"));
    const opt = { weekday: "short", day: "numeric", month: "short" };
    let s = dd.toLocaleDateString("fr-FR", opt);
    if (t) s += " · " + t;
    return s.charAt(0).toUpperCase() + s.slice(1);
  } catch { return d + (t ? " " + t : ""); }
}

function timeAgo(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return Math.floor(s / 60) + " min";
  if (s < 86400) return Math.floor(s / 3600) + " h";
  return new Date(ts).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}

/* ---------- Toasts ---------- */
function toast(msg, type = "info") {
  const root = $("#toastRoot") || document.body;
  const el = document.createElement("div");
  el.className = "toast " + type;
  const ico = type === "ok" ? "check" : type === "err" ? "close" : "info";
  el.innerHTML = icon(ico) + `<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(-10px)"; el.style.transition = ".3s"; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- Modale ---------- */
function modal({ title, body, footer = "", onOpen }) {
  const root = $("#modalRoot") || document.body;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" data-close style="width:36px;height:36px">${icon("close")}</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
    </div>`;
  const close = () => back.remove();
  back.addEventListener("click", (e) => { if (e.target === back || e.target.closest("[data-close]")) close(); });
  root.appendChild(back);
  onOpen?.(back, close);
  return { el: back, close };
}

function confirmModal(message, onYes, { danger = false, yes = "Confirmer" } = {}) {
  const { el, close } = modal({
    title: "Confirmation",
    body: `<p style="color:var(--muted)">${esc(message)}</p>`,
    footer: `<button class="btn btn-ghost" data-close>Annuler</button>
             <button class="btn ${danger ? "btn-red" : "btn-primary"}" data-yes>${esc(yes)}</button>`,
  });
  el.querySelector("[data-yes]").onclick = () => { close(); onYes(); };
}

const spinner = () => `<div class="spinner"></div>`;
const empty = (ic, text) =>

const S = { user: null, profile: null, config: {}, screen: "home", listeners: [], recorder: null };
const stop = () => { S.listeners.forEach((fn) => fn()); S.listeners = []; };
const track = (fn) => S.listeners.push(fn);

   ============================================================ */
injectIcons();

$$("#authTabs button").forEach((b) => b.addEventListener("click", () => {
  $$("#authTabs button").forEach((x) => x.classList.toggle("active", x === b));
  $("#loginForm").classList.toggle("hidden", b.dataset.tab !== "login");
  $("#registerForm").classList.toggle("hidden", b.dataset.tab !== "register");
}));

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    await signInWithEmailAndPassword(auth, f.email.value.trim(), f.password.value);
  } catch (err) { toast(authError(err), "err"); }
});

$("#registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const cred = await createUserWithEmailAndPassword(auth, f.email.value.trim(), f.password.value);
    await updateProfile(cred.user, { displayName: f.name.value.trim() });
    await set(ref(db, "users/" + cred.user.uid), {
      name: f.name.value.trim(), playerId: f.playerId.value.trim(),
      email: f.email.value.trim(), photoURL: "", role: "player", createdAt: serverTimestamp(),
    });
  } catch (err) { toast(authError(err), "err"); }
});

$("#googleBtn").addEventListener("click", async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (err) { toast(authError(err), "err"); }
});

$("#completeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  await update(ref(db, "users/" + S.user.uid), {
    name: f.name.value.trim(), playerId: f.playerId.value.trim(),
  });
  location.reload();
});

function authError(err) {
  const m = { "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
    "auth/email-already-in-use": "Cet e-mail est déjà utilisé.",
    "auth/weak-password": "Mot de passe trop faible (min. 6 caractères).",
    "auth/popup-closed-by-user": "Connexion Google annulée." };
  return m[err.code] || "Erreur : " + (err.message || err.code);
}

onAuthStateChanged(auth, async (user) => {
  stop();
  if (!user) { showView("auth"); return; }
  S.user = user;
  const snap = await get(ref(db, "users/" + user.uid));
  let p = snap.val();
  if (!p) {
    p = { name: user.displayName || "Joueur", playerId: "", email: user.email || "",
      photoURL: user.photoURL || "", role: "player", createdAt: serverTimestamp() };
    await set(ref(db, "users/" + user.uid), p);
  } else if (user.photoURL && !p.photoCustom && p.photoURL !== user.photoURL) {
    // Rafraîchit automatiquement la photo du compte Google
    p.photoURL = user.photoURL;
    await update(ref(db, "users/" + user.uid), { photoURL: user.photoURL });
  }
  if (ADMIN_EMAILS.includes(user.email) && p.role !== "admin") {
    await update(ref(db, "users/" + user.uid), { role: "admin" }); p.role = "admin";
  }
  S.profile = p;
  if (!p.playerId) { showView("complete"); return; }
  showView("app");
  boot();
});

function showView(v) {
  $("#authView").classList.toggle("hidden", v !== "auth");
  $("#completeView").classList.toggle("hidden", v !== "complete");
  $("#appView").classList.toggle("hidden", v !== "app");
}

   ============================================================ */
function boot() {
  track(onValue(ref(db, "config"), (s) => {
    S.config = s.val() || { registrationEnabled: true, freeRegistration: true, registrationPrice: 0 };
    applyBranding();
  }));
  watchNotifications();
  applyProfileButton();
  navTo(S.screen);

  if (S.booted) return;
  S.booted = true;
  $("#tabbar").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-screen]"); if (!b) return;
    navTo(b.dataset.screen);
  });
  $("#profileBtn").onclick = () => navTo("profile");
  $("#notifBtn").onclick = () => navTo("notifications");
}

    if (logo) {
      el.innerHTML = `<img src="${esc(logo)}" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
      el.dataset.iconDone = "1";

  });
}

function applyProfileButton() {
  const btn = $("#profileBtn"); if (!btn) return;

    ? `<img src="${esc(url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`

function navTo(screen) {
  S.screen = screen;
  $$("#tabbar button").forEach((b) => b.classList.toggle("active", b.dataset.screen === screen));

  ({ home: screenHome, matches: screenMatches, shorts: screenShorts, chat: screenChat,
     messages: screenMessages, support: screenSupport, profile: screenProfile,
     notifications: screenNotifications }[screen] || screenHome)(c);
  c.scrollTo?.(0, 0);
}

function screenMatches(c) {
  screenClear();
  c.innerHTML = `
    <div class="screen">
      <div class="screen-head"><div class="eyebrow">PUBG Mobile</div><h2>Tournois</h2></div>
      <div class="grid" id="matchList">${spinner()}</div>

    bindMatchCards($("#matchList"), all);

function matchCard(m) {
  const players = teamPlayerCount(m);
  const teams = m.teams ? Object.keys(m.teams).length : 0;
  const pct = Math.min(100, Math.round((players / (m.maxPlayers || 100)) * 100));
  const statusBadge = m.status === "live" ? `<span class="badge live">En direct</span>`
    : m.status === "finished" ? `<span class="badge">Terminé</span>`
    : m.registrationOpen ? `<span class="badge ok">Inscriptions ouvertes</span>`
    : `<span class="badge bad">Inscriptions fermées</span>`;
  return `
  <div class="card match-card" data-mid="${m.id}">
    <div class="match-banner"><div class="match-title">${esc(m.title)}</div></div>
    <div class="row between" style="margin-bottom:10px">${statusBadge}
      <span class="badge warn">${m.freeEntry ? "Gratuit" : fmtMoney(m.entryFee)}</span></div>
    <div class="meta-line" style="margin-bottom:12px">
      <span class="row">${icon("calendar")}${fmtDate(m.date, m.time)}</span>
      <span class="row">${icon("map")}${esc(m.map || "TBD")}</span>
      <span class="row">${icon("grid")}${esc(m.mode || "Squad")}</span>
    </div>
    <div class="row between small muted" style="margin-bottom:6px">
      <span>${players}/${m.maxPlayers || 100} joueurs · ${teams}/${m.maxTeams || 25} équipes</span><span>${pct}%</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
  </div>`;
}

function bindMatchCards(root, all) {
  $$(".match-card", root).forEach((el) => el.onclick = () => {
    const m = all.find((x) => x.id === el.dataset.mid);
    if (m) openMatch(m.id);
  });
}

function openMatch(mid) {
  const { el, close } = modal({ title: "Chargement…", body: spinner() });
  const off = onValue(ref(db, "matches/" + mid), (snap) => {
    const m = snap.val(); if (!m) { close(); return; }
    m.id = mid;
    renderMatchDetail(el, m, close);
  });
  el.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) off(); }, { once: false });
}

function renderMatchDetail(root, m, close) {
  const modalEl = root.querySelector(".modal");
  const myTeam = findMyTeam(m);
  const players = teamPlayerCount(m);
  const teams = m.teams ? Object.entries(m.teams) : [];
  const canRegister = S.config.registrationEnabled && m.registrationOpen && m.status !== "finished";
  const teamMax = m.teamMax || 4;

  modalEl.innerHTML = `
    <div class="modal-head"><h3>${esc(m.title)}</h3>
      <button class="icon-btn" data-close style="width:36px;height:36px">${icon("close")}</button></div>
    <div class="modal-body">
      <div class="row wrap" style="gap:8px;margin-bottom:14px">
        ${m.status === "live" ? `<span class="badge live">En direct</span>` : m.status === "finished" ? `<span class="badge">Terminé</span>` : m.registrationOpen ? `<span class="badge ok">Ouvert</span>` : `<span class="badge bad">Fermé</span>`}
        <span class="badge warn">${m.freeEntry ? "Entrée gratuite" : "Entrée " + fmtMoney(m.entryFee)}</span>
        ${m.prizePool ? `<span class="badge"><span style="color:var(--gold)">${icon("trophy")}</span>${fmtMoney(m.prizePool)}</span>` : ""}
      </div>

      <div class="grid grid-2" style="margin-bottom:14px">
        ${info("calendar", "Date & heure", fmtDate(m.date, m.time))}
        ${info("map", "Carte", m.map || "À définir")}
        ${info("grid", "Mode", m.mode || "Squad")}
        ${info("users", "Taille équipe", `1 à ${teamMax} joueurs`)}
        ${info("target", "Joueurs", `${players}/${m.maxPlayers || 100}`)}
        ${info("shield", "Équipes", `${teams.length}/${m.maxTeams || 25}`)}
      </div>

      ${m.rules ? `<div class="card" style="margin-bottom:14px"><div class="eyebrow">Règlement</div><p class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(m.rules)}</p></div>` : ""}

      <div id="matchAction" style="margin-bottom:16px"></div>

      <div class="screen-head" style="margin:6px 0"><div class="eyebrow">Équipes inscrites</div></div>
      <div class="col" id="teamList">
        ${teams.length ? teams.map(([tid, t]) => teamRow(m, tid, t, myTeam, canRegister, teamMax)).join("") : empty("shield", "Soyez la première équipe inscrite.")}
      </div>
    </div>`;

  // action principale
  const act = modalEl.querySelector("#matchAction");
  if (myTeam) {
    act.innerHTML = `<div class="card"><div class="row between">
      <div><div class="eyebrow" style="color:var(--green)">Vous êtes inscrit</div>
      <b style="font-family:var(--ff-disp);font-size:18px">${esc(m.teams[myTeam].name)}</b></div>
      ${icon("check")}</div>
      <button class="btn btn-red btn-sm btn-block" style="margin-top:12px" data-leave>Quitter l'équipe</button></div>`;
    act.querySelector("[data-leave]").onclick = () => leaveTeam(m, myTeam);
  } else if (!canRegister) {
    act.innerHTML = `<div class="card"><p class="muted">${!S.config.registrationEnabled ? "Les inscriptions sont désactivées par l'administration." : "Les inscriptions pour ce match sont fermées."}</p></div>`;
  } else if (teams.length >= (m.maxTeams || 25)) {
    act.innerHTML = `<div class="card"><p class="muted">Le nombre maximum d'équipes est atteint.</p></div>`;
  } else {
    act.innerHTML = `<button class="btn btn-primary btn-block" data-create>${icon("plus")} Créer mon équipe ${m.freeEntry ? "" : "· " + fmtMoney(m.entryFee)}</button>`;
    act.querySelector("[data-create]").onclick = () => createTeam(m);
  }

  // rejoindre / actions équipe
  $$("[data-join]", modalEl).forEach((b) => b.onclick = () => joinTeam(m, b.dataset.join));
  injectIcons(modalEl);
}

const info = (ic, l, v) =>
  `<div class="card" style="padding:13px"><div class="row" style="gap:8px;color:var(--amber)">${icon(ic)}<span class="eyebrow" style="color:var(--muted)">${l}</span></div><b style="font-family:var(--ff-disp);font-size:17px;display:block;margin-top:4px">${esc(v)}</b></div>`;

function teamRow(m, tid, t, myTeam, canRegister, teamMax) {
  const members = t.members ? Object.entries(t.members) : [];
  const full = members.length >= teamMax;
  const rank = t.rank ? `<span class="rank-pill rank-${t.rank}">${t.rank}</span>` : "";
  const st = t.status === "qualified" ? `<span class="badge ok">Qualifié</span>`
    : t.status === "eliminated" ? `<span class="badge bad">Éliminé</span>` : "";
  return `<div class="list-item">
    ${rank || `<div class="avatar">${icon("shield")}</div>`}
    <div class="grow">
      <div class="row between"><b>${esc(t.name)}</b>${st}</div>
      <div class="small muted">${members.map(([, mm]) => esc(mm.name)).join(", ")} · ${members.length}/${teamMax}</div>
    </div>
    ${(!myTeam && canRegister && !full) ? `<button class="btn btn-sm btn-green" data-join="${tid}">Rejoindre</button>` : ""}
  </div>`;
}

async function createTeam(m) {
  const { el, close } = modal({
    title: "Créer une équipe",
    body: `<div class="field"><label>Nom de l'équipe</label><input id="tn" placeholder="Ex : Les Aigles de Bamako" /></div>
           <p class="small muted">Vous serez le capitaine. Vous pourrez ensuite inviter jusqu'à ${(m.teamMax||4)-1} coéquipiers.</p>`,
    footer: `<button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" data-ok>Créer</button>`,
  });
  el.querySelector("[data-ok]").onclick = async () => {
    const name = el.querySelector("#tn").value.trim();
    if (!name) return toast("Donnez un nom à l'équipe.", "err");
    const tid = push(ref(db, `matches/${m.id}/teams`)).key;
    await set(ref(db, `matches/${m.id}/teams/${tid}`), {
      name, captain: S.user.uid, createdAt: serverTimestamp(),
      paymentStatus: m.freeEntry ? "free" : "pending",
      members: { [S.user.uid]: { name: S.profile.name, playerId: S.profile.playerId } },
    });
    close();
    toast(m.freeEntry ? "Équipe créée, vous êtes inscrit." : "Équipe créée. Paiement à valider par l'admin.", "ok");
  };
}

async function joinTeam(m, tid) {
  const t = m.teams[tid];
  const members = t.members ? Object.keys(t.members) : [];
  if (members.length >= (m.teamMax || 4)) return toast("Cette équipe est complète.", "err");
  await update(ref(db, `matches/${m.id}/teams/${tid}/members/${S.user.uid}`), {
    name: S.profile.name, playerId: S.profile.playerId,
  });
  toast("Vous avez rejoint " + t.name + ".", "ok");
}

function leaveTeam(m, tid) {
  confirmModal("Voulez-vous vraiment quitter cette équipe ?", async () => {
    const t = m.teams[tid];
    const members = t.members ? Object.keys(t.members) : [];
    if (t.captain === S.user.uid || members.length <= 1) {
      await remove(ref(db, `matches/${m.id}/teams/${tid}`));
    } else {
      await remove(ref(db, `matches/${m.id}/teams/${tid}/members/${S.user.uid}`));
    }
    toast("Vous avez quitté l'équipe.", "info");
  }, { danger: true, yes: "Quitter" });
}

function shortItem(s) {
  const liked = s.likes && s.likes[S.user.uid];
  const likeCount = s.likes ? Object.keys(s.likes).length : 0;
  const media = s.type === "video"
    ? `<video src="${esc(s.url)}" loop muted playsinline></video>`
    : `<img src="${esc(s.url)}" alt="" />`;
  return `<div class="short" data-id="${s.id}">
    ${media}
    <div class="short-side">
      <button data-like="${s.id}" style="${liked ? "color:var(--red)" : ""}">${icon("heart")}</button>
      <span class="count">${likeCount}</span>
      ${s.uid === S.user.uid ? `<button data-del="${s.id}">${icon("trash")}</button>` : ""}
    </div>
    <div class="short-overlay">
      <div class="row" style="gap:8px"><div class="avatar" style="width:34px;height:34px">${initials(s.name)}</div><b>${esc(s.name)}</b></div>
      ${s.caption ? `<p style="margin-top:8px">${esc(s.caption)}</p>` : ""}
    </div>
  </div>`;
}

function bindShorts(feed, list) {
  // lecture auto au défilement
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const v = en.target.querySelector("video");
      if (!v) return;
      if (en.isIntersecting) v.play().catch(() => {}); else v.pause();
    });
  }, { threshold: 0.6, root: feed });
  $$(".short", feed).forEach((el) => {
    io.observe(el);
    const v = el.querySelector("video");
    if (v) el.onclick = () => { v.muted = !v.muted; };
  });
  $$("[data-like]", feed).forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    const s = list.find((x) => x.id === b.dataset.like);
    const path = `shorts/${b.dataset.like}/likes/${S.user.uid}`;
    if (s.likes && s.likes[S.user.uid]) await remove(ref(db, path));
    else await set(ref(db, path), true);
  });
  $$("[data-del]", feed).forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    confirmModal("Supprimer ce short ?", () => remove(ref(db, "shorts/" + b.dataset.del)), { danger: true, yes: "Supprimer" });
  });
}

function uploadShortDialog() {
  const { el, close } = modal({
    title: "Publier un short",
    body: `<div class="field"><label>Vidéo ou photo</label><input type="file" id="sf" accept="video/*,image/*" /></div>
           <div class="field"><label>Légende</label><input id="sc" placeholder="Décrivez votre moment de jeu…" /></div>
           <div id="up" class="small muted"></div>`,
    footer: `<button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" data-ok>${icon("upload")} Publier</button>`,
  });
  el.querySelector("[data-ok]").onclick = async () => {
    const file = el.querySelector("#sf").files[0];
    if (!file) return toast("Choisissez un fichier.", "err");
    el.querySelector("#up").innerHTML = "Téléversement en cours…";
    try {
      const url = await uploadFile(file, "shorts");
      await push(ref(db, "shorts"), {
        uid: S.user.uid, name: S.profile.name, url,
        type: file.type.startsWith("video") ? "video" : "photo",

      });
      close(); toast("Short publié !", "ok");
    } catch (e) { toast("Échec du téléversement.", "err"); el.querySelector("#up").innerHTML = ""; }
  };
}

function screenChat(c) {
  screenClear();
  c.innerHTML = `
    <div class="screen">
      <div class="screen-head"><div class="eyebrow">Salon général</div><h2>Chat</h2></div>
      ${chatBox("chat", "chatBoxMain")}
    </div>`;
  wireChat("chat", "chatBoxMain");
}

function chatBox(path, id) {
  return `<div class="chat-wrap" id="${id}">
    <div class="chat-stream" data-stream>${spinner()}</div>
    <div class="chat-input">
      <button class="icon-btn" data-attach title="Photo / Vidéo">${icon("camera")}</button>
      <button class="icon-btn" data-voice title="Message vocal">${icon("mic")}</button>
      <input data-text placeholder="Écrire un message…" />
      <button class="btn btn-primary" data-send style="padding:11px 14px">${icon("send")}</button>
      <input type="file" data-file accept="image/*,video/*" class="hidden" />
    </div>
  </div>`;
}

function wireChat(dbPath, boxId) {
  const box = $("#" + boxId);
  const stream = box.querySelector("[data-stream]");
  const textEl = box.querySelector("[data-text]");
  const fileEl = box.querySelector("[data-file]");

  screenTrack(onValue(query(ref(db, dbPath), orderByChild("createdAt"), limitToLast(60)), (snap) => {
    const list = snapList(snap);
    stream.innerHTML = list.length ? list.map(msgBubble).join("") : empty("chat", "Aucun message. Lancez la discussion !");
    stream.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
      confirmModal("Supprimer ce message ?", () => remove(ref(db, dbPath + "/" + b.dataset.del)), { danger: true, yes: "Supprimer" });
    });
    stream.scrollTop = stream.scrollHeight;
  }));

  const send = async (extra = {}) => {
    const text = textEl.value.trim();
    if (!text && !extra.url) return;
    await push(ref(db, dbPath), {
      uid: S.user.uid, name: S.profile.name, text, type: extra.type || "text",
      url: extra.url || "", createdAt: serverTimestamp(),
    });
    textEl.value = "";
  };
  box.querySelector("[data-send]").onclick = () => send();
  textEl.onkeydown = (e) => { if (e.key === "Enter") send(); };
  box.querySelector("[data-attach]").onclick = () => fileEl.click();
  fileEl.onchange = async () => {
    const f = fileEl.files[0]; if (!f) return;
    toast("Envoi du média…", "info");
    try { const url = await uploadFile(f, "chat"); await send({ url, type: f.type.startsWith("video") ? "video" : "photo" }); }
    catch { toast("Échec de l'envoi.", "err"); }
    fileEl.value = "";
  };
  box.querySelector("[data-voice]").onclick = (e) => toggleVoice(e.currentTarget, send);
}

function msgBubble(m) {
  const me = m.uid === S.user.uid;
  let media = "";
  if (m.type === "photo") media = `<img src="${esc(m.url)}" alt="" />`;
  else if (m.type === "video") media = `<video src="${esc(m.url)}" controls playsinline></video>`;
  else if (m.type === "audio") media = `<audio src="${esc(m.url)}" controls></audio>`;
  return `<div class="msg ${me ? "me" : ""}">
    ${me ? "" : `<span class="who">${esc(m.name)}</span>`}
    ${m.text || media ? `<div class="bubble">${media}${m.text ? esc(m.text) : ""}</div>` : ""}
    <span class="time">${timeAgo(m.createdAt)}${me ? ` · <button data-del="${m.id}" title="Supprimer" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font:inherit;text-decoration:underline">Supprimer</button>` : ""}</span>
  </div>`;
}

async function toggleVoice(btn, send) {
  if (S.recorder && S.recorder.state === "recording") {
    S.recorder.stop(); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      btn.innerHTML = icon("mic"); btn.classList.remove("rec-dot");
      const blob = new Blob(chunks, { type: "audio/webm" });
      toast("Envoi du vocal…", "info");
      try { const url = await uploadFile(new File([blob], "voice.webm", { type: "audio/webm" }), "chat"); await send({ url, type: "audio" }); }
      catch { toast("Échec de l'envoi vocal.", "err"); }
      S.recorder = null;
    };
    rec.start(); S.recorder = rec;
    btn.innerHTML = icon("close"); btn.classList.add("rec-dot");
    toast("Enregistrement… touchez à nouveau pour envoyer.", "info");
  } catch { toast("Micro indisponible.", "err"); }
}

function contactDialog() {

    title: "Contacter un joueur",
    body: `<div class="field"><input id="q" placeholder="Rechercher par nom ou ID joueur…" /></div><div id="res" class="col"></div>`,
  });
  const q = el.querySelector("#q"), res = el.querySelector("#res");

    const users = snapList(snap).filter((u) => u.id !== S.user.uid &&
      ((u.name || "").toLowerCase().includes(term) || (u.playerId || "").includes(term)));
    res.innerHTML = users.slice(0, 8).map((u) => `
      <div class="list-item thread-item" data-uid="${u.id}" data-name="${esc(u.name)}">
        <div class="avatar">${initials(u.name)}</div>
        <div class="grow"><b>${esc(u.name)}</b><div class="small muted">ID : ${esc(u.playerId || "—")}</div></div>
        ${icon("send")}</div>`).join("") || `<p class="small muted">Aucun joueur trouvé.</p>`;
    $$(".thread-item", res).forEach((it) => it.onclick = () => { close(); openPrivate(it.dataset.uid, it.dataset.name); });
  };
}

function threadId(a, b) { return [a, b].sort().join("_"); }

function openPrivate(otherUid, otherName) {
  const tid = threadId(S.user.uid, otherUid);
  const { el, close } = modal({ title: otherName, body: chatBox("threads/" + tid + "/messages", "pmBox") });
  const boxId = "pmBox";
  const box = el.querySelector("#" + boxId);
  const stream = box.querySelector("[data-stream]");
  const textEl = box.querySelector("[data-text]");
  const fileEl = box.querySelector("[data-file]");
  const path = "threads/" + tid + "/messages";

  const offv = onValue(query(ref(db, path), orderByChild("createdAt"), limitToLast(60)), (snap) => {
    const list = snapList(snap);
    stream.innerHTML = list.length ? list.map(msgBubble).join("") : empty("chat", "Écrivez le premier message.");
    stream.scrollTop = stream.scrollHeight;
  });
  el.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) offv(); });

  const send = async (extra = {}) => {
    const text = textEl.value.trim();
    if (!text && !extra.url) return;
    const ts = Date.now();
    await push(ref(db, path), { uid: S.user.uid, name: S.profile.name, text, type: extra.type || "text", url: extra.url || "", createdAt: serverTimestamp() });
    const preview = extra.url ? "[média]" : text;
    await set(ref(db, `userThreads/${S.user.uid}/${otherUid}`), { otherName, lastMsg: preview, ts });
    await set(ref(db, `userThreads/${otherUid}/${S.user.uid}`), { otherName: S.profile.name, lastMsg: preview, ts });
    textEl.value = "";
  };
  box.querySelector("[data-send]").onclick = () => send();
  textEl.onkeydown = (e) => { if (e.key === "Enter") send(); };
  box.querySelector("[data-attach]").onclick = () => fileEl.click();
  fileEl.onchange = async () => { const f = fileEl.files[0]; if (!f) return; toast("Envoi…", "info"); try { const url = await uploadFile(f, "chat"); await send({ url, type: f.type.startsWith("video") ? "video" : "photo" }); } catch { toast("Échec.", "err"); } fileEl.value = ""; };
  box.querySelector("[data-voice]").onclick = (e) => toggleVoice(e.currentTarget, send);
}

function newTicketDialog() {
  const { el, close } = modal({
    title: "Nouveau ticket",
    body: `<div class="field"><label>Sujet</label><input id="subj" placeholder="Ex : Problème d'inscription" /></div>
           <div class="field"><label>Message</label><textarea id="msg" placeholder="Décrivez votre demande…"></textarea></div>`,
    footer: `<button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" data-ok>Envoyer</button>`,
  });
  el.querySelector("[data-ok]").onclick = async () => {
    const subject = el.querySelector("#subj").value.trim();
    const text = el.querySelector("#msg").value.trim();
    if (!subject || !text) return toast("Remplissez tous les champs.", "err");
    const key = push(ref(db, "support")).key;
    await set(ref(db, "support/" + key), {
      uid: S.user.uid, name: S.profile.name, subject, status: "open", createdAt: serverTimestamp(),
      messages: { [push(ref(db, "x")).key]: { from: "user", name: S.profile.name, text, ts: Date.now() } },
    });
    close(); toast("Ticket envoyé.", "ok");
  };
}

function openTicket(id) {
  const { el } = modal({ title: "Ticket", body: chatBox("support/" + id + "/messages", "supBox") });
  const box = el.querySelector("#supBox");
  const stream = box.querySelector("[data-stream]");
  const textEl = box.querySelector("[data-text]");
  box.querySelector("[data-attach]").remove();
  box.querySelector("[data-voice]").remove();

  onValue(query(ref(db, "support/" + id + "/messages"), orderByChild("ts")), (snap) => {
    const list = snapList(snap);
    stream.innerHTML = list.map((m) => `
      <div class="msg ${m.from === "user" ? "me" : ""}">
        <span class="who">${m.from === "admin" ? "Support Escrime Mali" : esc(m.name)}</span>
        <div class="bubble">${esc(m.text)}</div><span class="time">${timeAgo(m.ts)}</span></div>`).join("");
    stream.scrollTop = stream.scrollHeight;
  });
  const send = async () => {
    const text = textEl.value.trim(); if (!text) return;
    await push(ref(db, "support/" + id + "/messages"), { from: "user", name: S.profile.name, text, ts: Date.now() });
    await update(ref(db, "support/" + id), { status: "open" });
    textEl.value = "";
  };
  box.querySelector("[data-send]").onclick = send;
  textEl.onkeydown = (e) => { if (e.key === "Enter") send(); };
}

/* ============================================================

function watchNotifications() {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  let first = true;
  track(onValue(query(ref(db, "announcements"), orderByChild("createdAt"), limitToLast(1)), async (snap) => {
    const list = snapList(snap); if (!list.length) return;
    const latest = list[0];
    const seenSnap = await get(ref(db, `users/${S.user.uid}/annSeen`));
    const seen = seenSnap.val() || 0;
    if (latest.createdAt > seen) {
      $("#notifDot")?.classList.remove("hidden");
      if (!first) {
        toast("Nouvelle annonce : " + latest.title, "info");
        if ("Notification" in window && Notification.permission === "granted")
          new Notification("Escrime Mali", { body: latest.title });
      }
    }
    first = false;
  }));
}

function screenNotifications(c) {
  screenClear();
  c.innerHTML = `<div class="screen"><div class="screen-head"><div class="eyebrow">Restez informé</div><h2>Notifications</h2></div><div class="col" id="annList">${spinner()}</div></div>`;
  screenTrack(onValue(query(ref(db, "announcements"), orderByChild("createdAt"), limitToLast(50)), async (snap) => {
    const list = snapList(snap).reverse();
    $("#annList").innerHTML = list.length ? list.map(annCard).join("") : empty("bell", "Aucune notification.");
    if (list.length) await update(ref(db, "users/" + S.user.uid), { annSeen: list[0].createdAt });
    $("#notifDot")?.classList.add("hidden");
  }));
}

function screenProfile(c) {
  screenClear();
  const p = S.profile;
  c.innerHTML = `
    <div class="screen">
      <div class="card" style="text-align:center">
        <div class="avatar" style="width:84px;height:84px;margin:0 auto 12px;font-size:32px">${p.photoURL ? `<img src="${esc(p.photoURL)}">` : initials(p.name)}</div>

        ${p.role === "admin" ? `<span class="badge ok">${icon("shield")} Admin</span>` : ""}</div>

            <div class="small muted" id="installHint">Ajoutez Escrime Mali à votre écran d'accueil</div></div>

        </div>

  $("#logout").onclick = () => signOut(auth);

      rows.push(`<div class="list-item">
        ${t.rank ? `<span class="rank-pill rank-${t.rank}">${t.rank}</span>` : `<div class="avatar">${icon("trophy")}</div>`}
        <div class="grow"><b>${esc(m.title)}</b>
          <div class="small muted">${esc(t.name)} · ${fmtDate(m.date, m.time)}</div></div>

    });
    $("#myResults").innerHTML = rows.length ? rows.join("") : empty("target", "Inscrivez-vous à un tournoi pour suivre vos résultats.");

function editProfileDialog() {
  const p = S.profile;
  const { el, close } = modal({
    title: "Modifier le profil",
    body: `
      <div style="text-align:center;margin-bottom:16px">
        <div class="avatar" id="avPrev" style="width:92px;height:92px;margin:0 auto 10px;font-size:34px">${p.photoURL ? `<img src="${esc(p.photoURL)}">` : initials(p.name)}</div>
        <div class="row" style="justify-content:center;gap:8px">
          <button class="btn btn-sm" id="pickPhoto">${icon("camera")} Choisir une photo</button>
          ${p.photoURL ? `<button class="btn btn-sm btn-ghost" id="rmPhoto">${icon("trash")} Retirer</button>` : ""}
        </div>
        <input type="file" id="phFile" accept="image/*" class="hidden">
      </div>
      <div class="field"><label>Nom</label><input id="pn" value="${esc(p.name)}"></div>
      <div class="field"><label>ID Joueur</label><input id="pid" value="${esc(p.playerId)}"></div>`,
    footer: `<button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" data-ok>Enregistrer</button>`,
  });

  let newPhoto; // undefined = inchangé ; "" = retiré ; string = nouvelle
  let custom = p.photoCustom;
  const prev = el.querySelector("#avPrev");
  const setPrev = (url) => { prev.innerHTML = url ? `<img src="${esc(url)}">` : initials(el.querySelector("#pn").value || p.name); };

  el.querySelector("#pickPhoto").onclick = () => el.querySelector("#phFile").click();
  el.querySelector("#phFile").onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) return toast("Image trop lourde (max 8 Mo).", "err");
    toast("Envoi de la photo…", "info");
    try {
      const url = await uploadFile(f, "avatars");
      newPhoto = url; custom = true; setPrev(url);
      toast("Photo prête. Enregistrez pour valider.", "ok");
    } catch { toast("Échec de l'envoi de la photo.", "err"); }
  };
  const rm = el.querySelector("#rmPhoto");
  if (rm) rm.onclick = () => {
    newPhoto = S.user.photoURL || ""; // revient à la photo Google si dispo, sinon initiales
    custom = false; setPrev(newPhoto);
  };

  el.querySelector("[data-ok]").onclick = async () => {
    const name = el.querySelector("#pn").value.trim();
    const playerId = el.querySelector("#pid").value.trim();
    if (!name || !playerId) return toast("Champs requis.", "err");
    const upd = { name, playerId };
    if (newPhoto !== undefined) { upd.photoURL = newPhoto; upd.photoCustom = custom; }
    await update(ref(db, "users/" + S.user.uid), upd);
    Object.assign(S.profile, upd);
    close(); toast("Profil mis à jour.", "ok");
    applyProfileButton(); navTo("profile");
  };
}

/* ============================================================
   OUTILS
   ============================================================ */
function snapList(snap) {
  const out = []; snap.forEach((ch) => { const v = ch.val() || {}; v.id = ch.key; out.push(v); }); return out;
}
function teamPlayerCount(m) {
  if (!m.teams) return 0;
  return Object.values(m.teams).reduce((s, t) => s + (t.members ? Object.keys(t.members).length : 0), 0);
}
function findMyTeam(m) {
  if (!m.teams) return null;
  for (const [tid, t] of Object.entries(m.teams))
    if (t.members && t.members[S.user.uid]) return tid;
  return null;
}
async function uploadFile(file, folder) {
  const path = `${folder}/${S.user.uid}/${Date.now()}_${file.name}`;
  const r = sRef(storage, path);
  await uploadBytes(r, file);
  return await getDownloadURL(r);
}

  <script>
/* ============================================================
 *  ESCRIME MALI — Installation PWA (application téléchargeable)
 *  Génère le manifeste + les icônes à la volée (fichier unique),
 *  capte l'invite d'installation et pilote le bouton "Installer".
 *  Script classique autonome (aucun import).
 * ========================================================== */
(function () {
  "use strict";

  var BG = "#0b0e13", AMBER = "#f5a623";

  /* --- Dessine une icône (crosshair amber sur fond sombre) --- */
  function makeIcon(size) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var x = c.getContext("2d"), s = size;
    x.fillStyle = BG; x.fillRect(0, 0, s, s);
    var cx = s / 2, cy = s / 2, r = s * 0.30;
    x.strokeStyle = AMBER; x.lineWidth = s * 0.05;
    x.lineCap = "round";
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke();
    x.beginPath();
    x.moveTo(cx, cy - r * 1.5); x.lineTo(cx, cy - r * 0.55);
    x.moveTo(cx, cy + r * 0.55); x.lineTo(cx, cy + r * 1.5);
    x.moveTo(cx - r * 1.5, cy); x.lineTo(cx - r * 0.55, cy);
    x.moveTo(cx + r * 0.55, cy); x.lineTo(cx + r * 1.5, cy);
    x.stroke();
    x.fillStyle = AMBER;
    x.beginPath(); x.arc(cx, cy, s * 0.04, 0, Math.PI * 2); x.fill();
    return c.toDataURL("image/png");
  }

  /* --- Injecte le manifeste (blob, même origine) --- */
  function installManifest() {
    try {
      var i192 = makeIcon(192), i512 = makeIcon(512);
      var manifest = {
        name: "Escrime Mali — PUBG Mobile",
        short_name: "Escrime Mali",
        description: "Compétition officielle PUBG Mobile au Mali.",
        start_url: location.href,
        scope: "./",
        display: "standalone",
        orientation: "portrait",
        background_color: BG,
        theme_color: BG,
        lang: "fr",
        icons: [
          { src: i192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: i512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      var url = URL.createObjectURL(blob);
      var link = document.querySelector('link[rel="manifest"]');
      if (!link) { link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
      link.href = url;

      var apple = document.createElement("link");
      apple.rel = "apple-touch-icon"; apple.href = i192;
      document.head.appendChild(apple);
      var cap = document.createElement("meta");
      cap.name = "apple-mobile-web-app-capable"; cap.content = "yes";
      document.head.appendChild(cap);
    } catch (e) { /* silencieux */ }
  }

  /* --- Petit toast maison (réutilise le style existant) --- */
  function toast(msg, type) {
    var root = document.getElementById("toastRoot") || document.body;
    var el = document.createElement("div");
    el.className = "toast " + (type || "info");
    el.innerHTML = "<span>" + msg + "</span>";
    root.appendChild(el);
    setTimeout(function () { el.style.opacity = "0"; el.style.transition = ".3s"; }, 3200);
    setTimeout(function () { el.remove(); }, 3600);
  }

  /* --- Fenêtre d'instructions (iOS / navigateurs sans invite) --- */
  function showGuide(html) {
    var root = document.getElementById("modalRoot") || document.body;
    var back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML =
      '<div class="modal" role="dialog">' +
        '<div class="modal-head"><h3>Installer l\'application</h3>' +
        '<button class="icon-btn" data-close style="width:36px;height:36px">✕</button></div>' +
        '<div class="modal-body">' + html + '</div>' +
        '<div class="modal-foot"><button class="btn btn-primary" data-close>J\'ai compris</button></div>' +
      '</div>';
    back.addEventListener("click", function (e) {
      if (e.target === back || e.target.closest("[data-close]")) back.remove();
    });
    root.appendChild(back);
  }

  var deferred = null;
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
                     window.navigator.standalone === true;
  var ua = navigator.userAgent || "";
  var isIOS = /iphone|ipad|ipod/i.test(ua);

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    refreshUI();
  });

  window.addEventListener("appinstalled", function () {
    deferred = null; isStandalone = true;
    toast("Application installée ✓", "ok");
    refreshUI();
  });

  window.__installApp = async function () {
    if (isStandalone) { toast("L'application est déjà installée.", "ok"); return; }
    if (deferred) {
      deferred.prompt();
      try { await deferred.userChoice; } catch (e) {}
      deferred = null; refreshUI();
      return;
    }
    if (isIOS) {
      showGuide(
        '<p style="color:var(--muted);line-height:1.6">Sur iPhone / iPad (Safari) :</p>' +
        '<ol style="color:var(--muted);line-height:1.9;padding-left:18px">' +
        '<li>Touchez le bouton <b>Partager</b> (carré avec une flèche).</li>' +
        '<li>Choisissez <b>Sur l\'écran d\'accueil</b>.</li>' +
        '<li>Validez avec <b>Ajouter</b>.</li></ol>'
      );
      return;
    }
    showGuide(
      '<p style="color:var(--muted);line-height:1.6">Pour installer l\'application :</p>' +
      '<ol style="color:var(--muted);line-height:1.9;padding-left:18px">' +
      '<li>Ouvrez le <b>menu</b> du navigateur (⋮).</li>' +
      '<li>Choisissez <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</li></ol>' +
      '<p class="small muted" style="margin-top:8px">Sur ordinateur, une icône d\'installation apparaît aussi dans la barre d\'adresse.</p>'
    );
  };

  function refreshUI() {
    var btn = document.getElementById("installAppBtn");
    var hint = document.getElementById("installHint");
    var card = document.getElementById("installCard");
    if (isStandalone) {
      if (card) card.style.display = "none";
      if (btn && !card) { btn.disabled = true; btn.textContent = "Application installée ✓"; }
      return;
    }
    if (btn) btn.disabled = false;
    if (hint) hint.textContent = deferred
      ? "Prête à installer sur votre appareil"
      : (isIOS ? "Via Partager → Sur l'écran d'accueil" : "Ajoutez Escrime Mali à votre écran d'accueil");
  }
  window.__refreshInstallUI = refreshUI;

  function boot() {
    installManifest();
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
    var btn = document.getElementById("installAppBtn");
    if (btn) btn.addEventListener("click", function () { window.__installApp(); });
    refreshUI();
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
